name: lovehub
description: Smart Couple Memory & Connection Tracker
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  go_router: ^13.2.0

  # Firebase
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.3
  cloud_firestore: ^5.2.1
  firebase_storage: ^12.1.2
  firebase_database: ^11.1.0
  firebase_messaging: ^15.1.0
  cloud_functions: ^5.0.4

  # Monitoring — Crashlytics + Performance (required for Play Store)
  firebase_crashlytics: ^4.0.0
  firebase_performance: ^0.10.1+10

  # AI
  google_generative_ai: ^0.4.3

  # Android Native
  home_widget: ^0.6.0
  flutter_foreground_task: ^8.8.0
  workmanager: ^0.5.2
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4

  # Maps
  google_maps_flutter: ^2.7.0
  geolocator: ^12.0.0

  # Media
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0
  cached_network_image: ^3.4.1

  # Animation
  rive: ^0.13.6
  lottie: ^3.1.2
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0

  # Push notifications (OneSignal — partner-activity push)
  onesignal_flutter: ^5.6.1

  # Charts
  fl_chart: ^0.68.0
  flutter_svg: ^2.0.10+1

  # Localization
  easy_localization: ^3.0.7

  # Markdown rendering (for static policy / TOS screens)
  flutter_markdown: ^0.7.3

  # PDF generation & sharing (memory export)
  pdf: ^3.11.1
  printing: ^5.13.3
  google_fonts: ^6.2.1

  # Utils
  intl: ^0.19.0
  shared_preferences: ^2.3.1
  connectivity_plus: ^6.0.3
  uuid: ^4.4.2
  url_launcher: ^6.3.0
  http: ^1.2.1
  dartz: ^0.10.1
  google_sign_in: ^6.2.1
  share_plus: ^10.0.0
  file_picker: ^8.0.0
  path_provider: ^2.1.4

  # ─── Security ──────────────────────────────────────────────────
  # Layer 6: FlutterSecureStorage (Keystore on Android / Keychain on iOS).
  flutter_secure_storage: ^9.2.2

  # Layer 4: Biometric / device-credential authentication.
  local_auth: ^2.3.0
  local_auth_android: ^1.0.46
  local_auth_darwin: ^1.4.0

  # Layer 3: SHA-256 hashing for the PIN hash + cryptographically
  # strong salts.
  crypto: ^3.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  riverpod_generator: ^2.4.3
  build_runner: ^2.4.11
  mockito: ^5.4.4
  mocktail: ^1.0.4
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/animations/
    - assets/images/
    - assets/rive/
    - assets/translations/
    - assets/legal/